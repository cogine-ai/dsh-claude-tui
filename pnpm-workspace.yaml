allowBuilds:
  # Harness' PTY adapter restores the executable bit on node-pty's macOS helper.
  '@deepseek-ai/dsh-subprocess-local': true
  # Koffi supplies the reviewed native boundary used by Harness' durable writes on Windows.
  koffi: true
  # Fixed-size PTY capture is also a dev-only visual qualification boundary.
  node-pty: true
  # These dependency lifecycle hooks are not needed by the published artifacts.
  '@google/genai': false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-loader@1.0.2'
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-agent-default-model@0.1.0-rc.6'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.6'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.6'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.6'
  - '@deepseek-ai/dsh-cmdline@0.1.0-rc.6'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.6'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.6'
  - '@deepseek-ai/dsh-scope@0.1.0-rc.6'
  - '@deepseek-ai/dsh-session@0.1.0-rc.6'
  - '@deepseek-ai/dsh-settings@0.1.0-rc.6'
  - '@deepseek-ai/dsh-system-prompt@0.1.0-rc.6'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.6'
  - '@deepseek-ai/dsh-typert-protocol@0.1.0-rc.6'
