<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness Claude TUI terminal preview</title>
  <desc id="desc">A Claude Code-style orange terminal header over a DeepSeek Harness prompt, with a powered by dsh badge and a single-line status bar.</desc>
  <rect width="1280" height="640" rx="28" fill="#17191e"/>
  <rect x="54" y="46" width="1172" height="548" rx="18" fill="#282b33" stroke="#41454f" stroke-width="2"/>
  <path d="M72 64a18 18 0 0 1 18-18h1100a18 18 0 0 1 18 18v36H72z" fill="#22252c"/>
  <circle cx="94" cy="73" r="7" fill="#ff6b80"/>
  <circle cx="118" cy="73" r="7" fill="#e3b341"/>
  <circle cx="142" cy="73" r="7" fill="#4eba65"/>
  <text x="640" y="80" text-anchor="middle" fill="#999999" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">DeepSeek Harness — Claude TUI</text>

  <!-- Draw the measured three-row Claude Code terminal mark as geometry so
       GitHub/browser font fallback cannot split or reshape its block glyphs. -->
  <g transform="translate(92 132)" fill="#d77757">
    <rect x="14" y="0" width="76" height="46"/>
    <rect x="0" y="20" width="14" height="14"/>
    <rect x="90" y="20" width="14" height="14"/>
    <rect x="16" y="46" width="9" height="16"/>
    <rect x="34" y="46" width="9" height="16"/>
    <rect x="61" y="46" width="9" height="16"/>
    <rect x="79" y="46" width="9" height="16"/>
    <rect x="31" y="13" width="7" height="12" fill="#000000"/>
    <rect x="66" y="13" width="7" height="12" fill="#000000"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22">
    <text x="252" y="150" fill="#f4f4f4" font-weight="700">DSH Claude TUI</text>

    <text x="252" y="184" fill="#999999">deepseek-official/deepseek-v4-flash · high · session-a1b2c3d4</text>

    <text x="252" y="218" fill="#999999">~/Coding/deepseek-harness</text>
    <rect x="973" y="193" width="199" height="34" rx="4" fill="#4d6bfe"/>
    <text x="1072" y="218" text-anchor="middle" fill="#ffffff">powered by dsh</text>

    <text x="86" y="332" fill="#888888">────────────────────────────────────────────────────────────────────────────────</text>
    <text x="86" y="374" fill="#f4f4f4">❯</text>
    <rect x="117" y="352" width="14" height="27" fill="#f4f4f4"/>
    <text x="86" y="416" fill="#888888">────────────────────────────────────────────────────────────────────────────────</text>

    <text x="102" y="464" fill="#999999" font-size="16">⏸ deepseek-official/deepseek-v4-flash · ? for shortcuts · ← for agents</text>
    <text x="1168" y="464" text-anchor="end" fill="#999999" font-size="16">reasoning on · transcript compact</text>
  </g>

  <text x="86" y="562" fill="#6f7480" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">24 real PTY frames  ·  22 comparison anchors  ·  119/119 tests</text>
</svg>
