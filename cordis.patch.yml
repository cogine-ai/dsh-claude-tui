# Claude-like full-screen terminal surface over the shared dsh-base bundle.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

# Native macOS FSEvents can block shutdown while closing a populated skills root.
# Keep live skill discovery, with a bounded polling interval on that platform.
- id: skill-filesystem
  config: !!js "process.platform === 'darwin' ? { watchUsePolling: true, watchPollIntervalMs: 1000 } : {}"

- id: tools
  config:
    mode: !!js "process.env.DSH_TOOLS_MODE === 'code' ? 'ptc' : (process.env.DSH_TOOLS_MODE || 'ptc')"

- insert:
    # The base bundle provides the question service; this consumer exposes it
    # to the model so the TUI's registered provider is reachable end to end.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: claude-tui-startup
      name: dsh-claude-tui/startup

    - id: claude-tui
      name: dsh-claude-tui
      inject: [claudeTuiStartup]
      config:
        title: DSH Claude TUI
        color: true
        showReasoning: true
        maxTranscriptRows: 5000
        maxToolOutputLines: 8
